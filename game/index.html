<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR HEAT — an open-world crime game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23ff8c42'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%231a1a22' font-family='sans-serif' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a2a3a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #menu, #pause, #over { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
  #sr-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR HEAT: explore Solmar City on foot and by car, run missions, outrun the police"></canvas>
<div id="hud"></div>
<div id="menu"></div>
<!-- #pause and #over overlays are built by hud.js itself. -->
<p id="sr-status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script src="./src/config.js"></script>
<script src="./src/random.js"></script>
<script src="./src/input.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/textures.js"></script>
<script src="./src/city.js"></script>
<script src="./src/vehicles.js"></script>
<script src="./src/characters.js"></script>
<script src="./src/traffic.js"></script>
<script src="./src/pedestrians.js"></script>
<script src="./src/police.js"></script>
<script src="./src/combat.js"></script>
<script src="./src/missions.js"></script>
<script src="./src/hud.js"></script>
<script src="./src/player.js"></script>
<script src="./src/render.js"></script>
<script src="./src/shots.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
